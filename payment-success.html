<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Gear Radar Digital Solutions</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 40px 30px; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        .icon-box { width: 70px; height: 70px; background: rgba(16, 185, 129, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: #10b981; font-size: 32px; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; color: #ffffff; }
        p { font-size: 15px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
        .details-box { background: #0f172a; border-radius: 8px; padding: 16px; margin-bottom: 24px; text-align: left; font-size: 13px; color: #cbd5e1; }
        .details-box div { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .details-box div:last-child { margin-bottom: 0; }
        .btn { display: inline-block; background: #0284c7; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: background 0.2s; }
        .btn:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-box">✓</div>
        <h1>Payment Confirmed!</h1>
        <p>Thank you for choosing Gear Radar. Your transaction has been securely processed, and our team has been notified to kick off your project.</p>
        
        <div class="details-box">
            <div><span>Status:</span> <strong style="color: #10b981;">Verified / Paid</strong></div>
            <div><span>Confirmation:</span> <span>Invoice sent to your email</span></div>
            <div><span>Next Step:</span> <span>Consultant onboarding kickoff</span></div>
        </div>

        <a href="https://gearradar.co.uk" class="btn">Return to Homepage</a>
    </div>
</body>
</html>
