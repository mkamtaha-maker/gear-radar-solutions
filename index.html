<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gear Radar Digital Solutions | Autonomous Web & AI Growth Systems</title>
  
  <meta name="description" content="Autonomous digital solutions, rapid web deployment, and intelligent AI automation systems for modern businesses worldwide by Kam Tyler." />
  <meta property="og:title" content="Gear Radar Digital Solutions" />
  <meta property="og:description" content="Autonomous Web & AI Growth Systems for Modern Businesses Worldwide." />
  <meta property="og:url" content="https://gearradar.co.uk" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #070a12;
      --bg-surface: #0e1526;
      --card-bg: rgba(16, 24, 44, 0.7);
      --card-border: rgba(56, 189, 248, 0.15);
      --card-border-hover: rgba(56, 189, 248, 0.5);
      --primary: #0284c7;
      --primary-hover: #0ea5e9;
      --accent: #38bdf8;
      --accent-cyan: #00f0ff;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(2, 132, 199, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(0, 240, 255, 0.05) 0%, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      background: rgba(7, 10, 18, 0.85);
      border-bottom: 1px solid var(--card-border);
    }

    .nav-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }

    /* Static Brand Logo */
    .brand-logo-img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--accent);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
      background: #0b1329;
    }

    .brand-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-text span {
      color: var(--accent-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .nav-links {
      display: flex;
      gap: 24px;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--accent-cyan);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 0.8rem;
      color: var(--accent-green);
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }

    .btn-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
      padding: 8px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.88rem;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.4);
      transition: all 0.2s;
    }

    .btn-header:hover {
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.6);
      transform: translateY(-1px);
    }

    /* Hero Section */
    .hero {
      padding: 75px 0 45px;
      text-align: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3.1rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.15rem;
      max-width: 740px;
      margin: 0 auto 32px;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #00b4d8);
      color: #fff;
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(0, 180, 216, 0.3);
      transition: all 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0, 240, 255, 0.5);
    }

    .btn-secondary {
      background: rgba(30, 41, 59, 0.8);
      color: #fff;
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      border-color: var(--accent-cyan);
      background: #1e293b;
    }

    /* Stats Grid */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin: 45px 0 60px;
    }

    .stat-item {
      padding: 20px;
      text-align: center;
    }

    .stat-val {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent-cyan);
      margin-bottom: 4px;
    }

    .stat-lbl {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* AI Architecture */
    .section-head {
      text-align: center;
      margin: 60px 0 36px;
    }

    .section-head h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 10px;
    }

    .section-head p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 60px;
    }

    .agent-card {
      padding: 24px;
      border-left: 3px solid var(--accent);
      transition: transform 0.2s;
    }

    .agent-card:hover {
      transform: translateY(-3px);
      border-left-color: var(--accent-cyan);
    }

    .agent-role {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .agent-name {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #fff;
    }

    .agent-desc {
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    /* Channels / Contact Grid */
    .channels-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin: 30px 0 60px;
    }

    .channel-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 26px 20px;
      border-radius: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .channel-title {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 14px;
    }
